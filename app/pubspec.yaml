name: dismessage
description: "Messagerie où l'on voit l'interlocuteur écrire en direct."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  dismessage_protocol:
    path: ../packages/protocol
  # Voice messages: only the Web and Windows implementations. Android uses
  # its own channel (VoiceHandler.kt) to avoid extra Gradle downloads.
  audioplayers_platform_interface: ^7.0.0
  audioplayers_web: ^5.0.1
  audioplayers_windows: ^4.0.0
  # Webcam in the Windows app (the web uses getUserMedia directly; Android
  # takes photos through image_picker). 0.2.6+5 and later need Flutter 3.38.
  camera_platform_interface: ^2.12.0
  camera_windows: ^0.2.6+4
  # Files to send: the Windows chooser only, through its interface (Android
  # has its own channel, FileHandler.kt; the web uses <input type=file>).
  file_selector_platform_interface: ^2.6.0
  file_selector_windows: ^0.9.3+5
  image: ^4.5.4
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  record_platform_interface: ^1.6.0
  record_web: ^1.3.0
  record_windows: ^1.0.7
  shared_preferences: ^2.5.3
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  dismessage_server:
    path: ../server
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
