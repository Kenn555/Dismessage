<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Messagerie où l'on voit l'interlocuteur écrire en direct.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dismessage">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dismessage</title>
  <meta name="theme-color" content="#5B5BD6">
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg">
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --bg: #f7f7fb; --fg: #1b1b23; --muted: #6b6b7b; --accent: #5b5bd6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #131318; --fg: #e5e1e9; --muted: #9a98a8; --accent: #c1c1ff; }
    }
    body { margin: 0; background: var(--bg); }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      font-family: system-ui, sans-serif; color: var(--fg);
    }
    #loading img {
      width: 88px; height: 88px; margin-bottom: 8px;
      filter: drop-shadow(0 12px 24px rgba(91, 91, 214, .35));
      animation: float 2.4s infinite ease-in-out;
    }
    @keyframes float { 0%, 100% { transform: translateY(0); }
                       50% { transform: translateY(-6px); } }
    #loading h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
    #loading p { margin: 0; color: var(--muted); font-size: 15px; }
    #loading .dots span {
      display: inline-block; width: 8px; height: 8px; margin: 0 3px;
      border-radius: 50%; background: var(--accent);
      animation: pulse 1.2s infinite ease-in-out;
    }
    #loading .dots span:nth-child(2) { animation-delay: .2s; }
    #loading .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse { 0%, 60%, 100% { opacity: .3; transform: translateY(0); }
                       30% { opacity: 1; transform: translateY(-4px); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/logo.svg" alt="">
    <h1>Dismessage</h1>
    <div class="dots"><span></span><span></span><span></span></div>
    <p>Chargement… le premier lancement peut prendre une minute.</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
