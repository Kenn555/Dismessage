# Builds the Flutter web client and publishes it on GitHub Pages.
# The page talks to the production relay (see app/lib/config.dart).
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths: [app/**, packages/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true
      - name: Test
        working-directory: app
        run: |
          flutter pub get
          flutter test
      - name: Build
        working-directory: app
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
